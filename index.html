<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frank's CRM/ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F2ED;
    --panel:#FFFFFF;
    --ink:#14161A;
    --ink-soft:#5A5D66;
    --line:#DEDBD1;
    --line-soft:#EAE8E0;
    --accent:#2952E3;
    --accent-soft:#E9EDFC;
    --urgent:#D8402A;
    --urgent-soft:#FBE7E3;
    --callback:#D98A1F;
    --callback-soft:#FBEDD8;
    --fixed:#1C8C5A;
    --fixed-soft:#E1F3EA;
    --new:#6E7180;
    --new-soft:#EAEAEC;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,22,26,0.04), 0 4px 16px rgba(20,22,26,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  .app{display:flex; min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:220px; flex-shrink:0;
    background:var(--ink); color:#F3F2ED;
    display:flex; flex-direction:column;
    padding:20px 14px;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:19px; letter-spacing:-0.01em;
    padding:6px 8px 4px;
    line-height:1.15;
  }
  .brand small{
    display:block; font-family:'JetBrains Mono',monospace;
    font-size:10px; font-weight:400; letter-spacing:0.08em;
    color:#9A9DAE; text-transform:uppercase; margin-top:4px;
  }
  .nav{margin-top:28px; display:flex; flex-direction:column; gap:2px;}
  .nav button{
    all:unset; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:10px 10px; border-radius:8px;
    font-size:13.5px; font-weight:500; color:#C7C9D3;
    transition:background .12s, color .12s;
  }
  .nav button svg{width:16px;height:16px; flex-shrink:0;}
  .nav button:hover{background:#22242C; color:#fff;}
  .nav button.active{background:#2A2D38; color:#fff;}
  .nav-count{
    margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:10.5px;
    color:#8B8EA0; background:#22242C; padding:2px 6px; border-radius:5px;
  }
  .sidebar-footer{margin-top:auto; padding-top:16px; border-top:1px solid #24262F;}
  .sidebar-footer .tag{font-family:'JetBrains Mono',monospace; font-size:10px; color:#71748A; letter-spacing:.04em;}

  /* MAIN */
  .main{flex:1; min-width:0; padding:28px 32px 60px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .topbar h1{font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0; letter-spacing:-0.01em;}
  .topbar .sub{color:var(--ink-soft); font-size:13px; margin-top:2px;}
  .btn{
    all:unset; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:9px 16px; border-radius:8px; display:inline-flex; align-items:center; gap:7px;
    transition:transform .08s, box-shadow .12s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent); color:#fff; box-shadow:0 1px 0 rgba(0,0,0,0.08);}
  .btn-primary:hover{background:#2140C4;}
  .btn-ghost{background:var(--panel); color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-sm{padding:6px 11px; font-size:12px;}
  .btn svg{width:14px;height:14px;}

  /* Toolbar / filters */
  .toolbar{display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .search{
    flex:1; min-width:180px; position:relative;
  }
  .search input{
    width:100%; padding:9px 12px 9px 34px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); font-size:13.5px; font-family:'Inter',sans-serif; color:var(--ink);
  }
  .search input:focus{outline:none; border-color:var(--accent);}
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px;height:14px; color:var(--ink-soft);}
  .chip{
    font-size:12px; font-weight:600; padding:7px 12px; border-radius:20px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel); color:var(--ink-soft); white-space:nowrap;
    transition:all .1s;
  }
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  select.chip{-webkit-appearance:none; appearance:none;}

  /* Status badge */
  .status{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.02em;
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .status::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .status.s-new{background:var(--new-soft); color:var(--new);}
  .status.s-urgent{background:var(--urgent-soft); color:var(--urgent);}
  .status.s-callback{background:var(--callback-soft); color:var(--callback);}
  .status.s-fixed{background:var(--fixed-soft); color:var(--fixed);}

  /* Client table */
  .board{background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .row{
    display:grid; grid-template-columns: 1.5fr 1fr 1fr 0.9fr 0.8fr 0.9fr auto;
    gap:10px; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line-soft);
    cursor:pointer; transition:background .1s;
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:#FAFAF7;}
  .row.head{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); cursor:default; background:#FAFAF7; font-weight:600;
  }
  .row.head:hover{background:#FAFAF7;}
  .cell-name{font-weight:600; font-size:13.5px;}
  .cell-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .cell{font-size:13px; color:var(--ink);}
  .cell.muted{color:var(--ink-soft); font-size:12.5px;}
  .mono{font-family:'JetBrains Mono',monospace; font-size:12px;}
  .row .actions{display:flex; gap:6px; opacity:0; transition:opacity .1s;}
  .row:hover .actions{opacity:1;}
  .icon-btn{
    all:unset; cursor:pointer; width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    border-radius:6px; color:var(--ink-soft);
  }
  .icon-btn:hover{background:var(--line-soft); color:var(--ink);}
  .icon-btn svg{width:14px;height:14px;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty .big{font-family:'Space Grotesk',sans-serif; font-size:16px; color:var(--ink); margin-bottom:6px;}

  /* Drawer / Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,22,26,0.32); z-index:50;
    display:flex; justify-content:flex-end;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .drawer{
    width:min(480px, 100vw); background:var(--paper); height:100%; overflow-y:auto;
    box-shadow:-8px 0 30px rgba(0,0,0,0.12);
    animation:slideIn .18s ease;
  }
  @keyframes slideIn{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between; padding:18px 22px;
    border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:2;
  }
  .drawer-head h2{font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0;}
  .drawer-body{padding:22px;}
  .close-btn{all:unset; cursor:pointer; width:28px;height:28px; display:flex; align-items:center; justify-content:center; border-radius:7px; color:var(--ink-soft);}
  .close-btn:hover{background:var(--line-soft);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:var(--panel);
    font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .divider{height:1px; background:var(--line); margin:20px 0;}
  .section-label{font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .section-label::after{content:''; flex:1; height:1px; background:var(--line);}

  /* Match log (follow-up history) */
  .log{display:flex; flex-direction:column;}
  .log-entry{position:relative; padding:0 0 18px 22px; border-left:2px solid var(--line);}
  .log-entry:last-child{border-color:transparent; padding-bottom:2px;}
  .log-entry::before{
    content:''; position:absolute; left:-6px; top:2px; width:10px; height:10px; border-radius:50%;
    background:var(--new); border:2px solid var(--paper);
  }
  .log-entry.s-urgent::before{background:var(--urgent);}
  .log-entry.s-callback::before{background:var(--callback);}
  .log-entry.s-fixed::before{background:var(--fixed);}
  .log-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:3px;}
  .log-comment{font-size:13px; line-height:1.5;}
  .log-empty{font-size:12.5px; color:var(--ink-soft); font-style:italic; padding-left:4px;}

  .addfollow{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:18px;}

  /* Calendar */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-head .month{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600;}
  .cal-nav{display:flex; gap:6px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--ink-soft); text-align:center; padding-bottom:4px; letter-spacing:.05em;}
  .cal-day{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:8px; min-height:78px;
    padding:6px; font-size:12px; cursor:pointer; transition:border-color .1s;
    display:flex; flex-direction:column; gap:4px;
  }
  .cal-day:hover{border-color:var(--accent);}
  .cal-day.out{background:transparent; border-color:transparent; cursor:default;}
  .cal-day.today{border-color:var(--ink); border-width:1.5px;}
  .cal-daynum{font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--ink-soft);}
  .cal-day.today .cal-daynum{color:var(--ink);}
  .cal-dot-row{display:flex; flex-wrap:wrap; gap:3px;}
  .dot{width:7px; height:7px; border-radius:50%;}
  .dot.d-created{background:var(--accent);}
  .dot.d-new{background:var(--new);}
  .dot.d-urgent{background:var(--urgent);}
  .dot.d-callback{background:var(--callback);}
  .dot.d-fixed{background:var(--fixed);}
  .cal-legend{display:flex; gap:16px; margin-top:14px; flex-wrap:wrap;}
  .cal-legend span{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}

  .daylist{background:var(--panel); border:1px solid var(--line-soft); border-radius:10px; padding:16px; margin-top:16px;}
  .daylist h3{font-family:'Space Grotesk',sans-serif; font-size:14px; margin:0 0 10px;}
  .daylist-item{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line-soft); cursor:pointer;}
  .daylist-item:last-child{border-bottom:none;}
  .daylist-item:hover .cell-name{color:var(--accent);}

  /* Settings */
  .settings-card{background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:20px; max-width:560px; margin-bottom:16px; box-shadow:var(--shadow);}
  .settings-card h3{font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0 0 4px;}
  .settings-card p{font-size:12.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 14px;}
  .row-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:11px 18px;
    border-radius:8px; font-size:13px; font-weight:500; z-index:100; box-shadow:0 6px 24px rgba(0,0,0,0.2);
    animation:toastIn .15s ease;
  }
  @keyframes toastIn{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}

  @media (max-width:860px){
    .sidebar{width:76px; align-items:center;}
    .brand small, .nav button span, .sidebar-footer{display:none;}
    .brand{font-size:0;}
    .brand::before{content:"F"; font-size:20px;}
    .nav button{justify-content:center; padding:11px;}
    .main{padding:18px 14px 50px;}
    .row{grid-template-columns:1fr auto; grid-template-rows:auto auto; row-gap:6px;}
    .row.head{display:none;}
    .cell.hide-mobile, .cell-sub.hide-mobile{display:none;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- STORAGE ---------------- */
const STORE_KEY = 'franks_crm_clients';
const SETTINGS_KEY = 'franks_crm_settings';
let clients = [];
let settings = { sheetUrl: '' };
let currentView = 'dashboard';
let searchQuery = '';
let statusFilter = 'all';
let campaignFilter = 'all';
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let selectedDay = null;
let openClientId = null;
let editClientId = null;

const STATUS_LABELS = {
  new: 'New Lead',
  urgent: 'Urgent Callback',
  callback: 'Callback',
  fixed: 'Appointment Fixed'
};

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    clients = raw ? JSON.parse(raw) : [];
  }catch(e){ clients = []; }
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    settings = raw ? JSON.parse(raw) : { sheetUrl:'' };
  }catch(e){ settings = { sheetUrl:'' }; }
  render();
}

function persistClients(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(clients)); }
  catch(e){ console.error('save failed', e); showToast('Could not save — your browser storage may be full or disabled.'); }
}
function persistSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
  catch(e){ console.error('save failed', e); }
}

window.addEventListener('storage', (e)=>{
  if(e.key === STORE_KEY){
    try{ clients = e.newValue ? JSON.parse(e.newValue) : []; render(); }catch(err){}
  }
  if(e.key === SETTINGS_KEY){
    try{ settings = e.newValue ? JSON.parse(e.newValue) : { sheetUrl:'' }; }catch(err){}
  }
});

let toastTimer = null;
function showToast(msg){
  clearTimeout(toastTimer);
  let t = document.getElementById('toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.className='toast'; t.id='toast'; t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(()=>t.remove(), 2600);
}

/* ---------------- ICONS ---------------- */
const ICONS = {
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.14.6.6 1.06 1.56 1.04H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>',
  chevR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>'
};

function statusClass(s){ return 'status s-'+s; }

/* ---------------- RENDER ROOT ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${currentView==='dashboard' ? renderDashboard() : ''}
      ${currentView==='calendar' ? renderCalendar() : ''}
      ${currentView==='settings' ? renderSettings() : ''}
    </div>
  `;
  if(drawerMode) renderDrawer();
  attachHandlers();
}

/* ---------------- SIDEBAR ---------------- */
function renderSidebar(){
  const total = clients.length;
  const urgentCount = clients.filter(c=>c.status==='urgent').length;
  return `
  <div class="sidebar">
    <div class="brand">Frank's CRM<small>/ ERP · pipeline tracker</small></div>
    <div class="nav">
      <button data-nav="dashboard" class="${currentView==='dashboard'?'active':''}">${ICONS.grid}<span>Clients</span><span class="nav-count">${total}</span></button>
      <button data-nav="calendar" class="${currentView==='calendar'?'active':''}">${ICONS.cal}<span>Calendar</span></button>
      <button data-nav="settings" class="${currentView==='settings'?'active':''}">${ICONS.gear}<span>Sync &amp; Export</span></button>
    </div>
    <div class="sidebar-footer">
      <div class="tag">URGENT NOW: ${urgentCount}</div>
    </div>
  </div>`;
}

/* ---------------- DASHBOARD ---------------- */
function filteredClients(){
  return clients.filter(c=>{
    if(statusFilter!=='all' && c.status!==statusFilter) return false;
    if(campaignFilter!=='all' && (c.campaign||'—')!==campaignFilter) return false;
    if(searchQuery){
      const q = searchQuery.toLowerCase();
      const hay = [c.name,c.email,c.phone,c.company,c.position,c.location,c.campaign].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> (b.createdDate||'').localeCompare(a.createdDate||''));
}

function campaignOptions(){
  const set = new Set(clients.map(c=>c.campaign).filter(Boolean));
  return Array.from(set);
}

function renderDashboard(){
  const list = filteredClients();
  return `
  <div class="topbar">
    <div>
      <h1>Client Pipeline</h1>
      <div class="sub">${clients.length} lead${clients.length===1?'':'s'} tracked · ${clients.filter(c=>c.status==='fixed').length} appointment${clients.filter(c=>c.status==='fixed').length===1?'':'s'} fixed</div>
    </div>
    <button class="btn btn-primary" id="btn-add-client">${ICONS.plus}Add Client</button>
  </div>

  <div class="toolbar">

/* ---------------- CALENDAR ---------------- */
function renderCalendar(){
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = first.toLocaleDateString('en-GB', { month:'long', year:'numeric' });
  const todayIso = todayISO();

  const dayMap = {};
  clients.forEach(c=>{
    if(c.createdDate){
      const iso = c.createdDate;
      dayMap[iso] = dayMap[iso] || { created:[], follow:[] };
      dayMap[iso].created.push(c);
    }
    if(c.nextFollowUp){
      const iso = c.nextFollowUp;
      dayMap[iso] = dayMap[iso] || { created:[], follow:[] };
      dayMap[iso].follow.push(c);
    }
  });

  let cells = '';
  for(let i=0;i<startDow;i++){ cells += `<div class="cal-day out"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const info = dayMap[iso];
    const isToday = iso===todayIso;
    let dots = '';
    if(info){
      info.created.forEach(()=> dots += `<span class="dot d-created"></span>`);
      info.follow.forEach(c=> dots += `<span class="dot d-${c.status}"></span>`);
    }
    cells += `<div class="cal-day ${isToday?'today':''}" data-day="${iso}">
      <div class="cal-daynum">${d}</div>
      <div class="cal-dot-row">${dots}</div>
    </div>`;
  }

  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  return `
  <div class="topbar">
    <div>
      <h1>Calendar</h1>
      <div class="sub">Blue dots = lead created · colored dots = scheduled follow-up</div>
    </div>
  </div>
  <div class="cal-head">
    <div class="month">${monthName}</div>
    <div class="cal-nav">
      <button class="btn btn-ghost btn-sm" id="cal-prev">${ICONS.chevL}</button>
      <button class="btn btn-ghost btn-sm" id="cal-today">Today</button>
      <button class="btn btn-ghost btn-sm" id="cal-next">${ICONS.chevR}</button>
    </div>
  </div>
  <div class="cal-grid">
    ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells}
  </div>
  <div class="cal-legend">
    <span><span class="dot d-created"></span> Lead created</span>
    <span><span class="dot d-new"></span> New Lead</span>
    <span><span class="dot d-urgent"></span> Urgent Callback</span>
    <span><span class="dot d-callback"></span> Callback</span>
    <span><span class="dot d-fixed"></span> Appointment Fixed</span>
  </div>
  ${selectedDay ? renderDayList(selectedDay, dayMap[selectedDay]) : ''}
  `;
}

function renderDayList(iso, info){
  const items = [];
  if(info){
    info.created.forEach(c=> items.push({c, tag:'Lead created'}));
    info.follow.forEach(c=> items.push({c, tag:'Follow-up scheduled'}));
  }
  return `
  <div class="daylist">
    <h3>${fmtDate(iso)}</h3>
    ${items.length===0 ? `<div class="log-empty">Nothing scheduled this day.</div>` :
      items.map(({c,tag})=>`
      <div class="daylist-item" data-open="${c.id}">
        <div>
          <div class="cell-name">${escapeHtml(c.name)}</div>
          <div class="cell-sub">${tag} · ${escapeHtml(c.company||'')}</div>
        </div>
        <span class="${statusClass(c.status)}">${STATUS_LABELS[c.status]}</span>
      </div>`).join('')}
  </div>`;
}

/* ---------------- HANDLERS ---------------- */
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(b=> b.onclick = ()=>{ currentView=b.dataset.nav; selectedDay=null; render(); });
  const addBtn = document.getElementById('btn-add-client');
  if(addBtn) addBtn.onclick = ()=> openForm(null);

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.oninput = (e)=>{ searchQuery = e.target.value; renderInPlaceDashboard(); };
    searchInput.focus();
    searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;
  }
  document.querySelectorAll('[data-status]').forEach(el=> el.onclick = ()=>{ statusFilter = el.dataset.status; render(); });
  const campSel = document.getElementById('campaign-filter');
  if(campSel) campSel.onchange = (e)=>{ campaignFilter = e.target.value; render(); };

  document.querySelectorAll('[data-open]').forEach(el=> el.onclick = (e)=>{
    if(e.target.closest('.actions')) return;
    openDetail(el.dataset.open);
  });
  document.querySelectorAll('[data-edit]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); openForm(el.dataset.edit); });
  document.querySelectorAll('[data-del]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); deleteClient(el.dataset.del); });

  const prev = document.getElementById('cal-prev'), next = document.getElementById('cal-next'), tdy = document.getElementById('cal-today');
  if(prev) prev.onclick = ()=>{ calMonth--; if(calMonth<0){calMonth=11; calYear--;} render(); };
  if(next) next.onclick = ()=>{ calMonth++; if(calMonth>11){calMonth=0; calYear++;} render(); };
  if(tdy) tdy.onclick = ()=>{ const d=new Date(); calMonth=d.getMonth(); calYear=d.getFullYear(); selectedDay=todayISO(); render(); };
  document.querySelectorAll('.cal-day[data-day]').forEach(el=> el.onclick = ()=>{ selectedDay = el.dataset.day; render(); });

  const saveUrl = document.getElementById('save-url');
  if(saveUrl) saveUrl.onclick = async ()=>{ settings.sheetUrl = document.getElementById('sheet-url').value.trim(); await persistSettings(); showToast('Saved.'); };
  const pushBtn = document.getElementById('push-sheet');
  if(pushBtn) pushBtn.onclick = pushToSheet;
  const pullBtn = document.getElementById('pull-sheet');
  if(pullBtn) pullBtn.onclick = pullFromSheet;
  const csvBtn = document.getElementById('export-csv');
  if(csvBtn) csvBtn.onclick = exportCSV;
}

function renderInPlaceDashboard(){
  const main = document.querySelector('.main');
  if(main) main.innerHTML = renderDashboard();
  attachHandlers();
  const si = document.getElementById('search-input');
  if(si){ si.focus(); si.selectionStart = si.selectionEnd = si.value.length; }
}

function attachDrawerHandlers(){
  const closeBtn = document.getElementById('close-drawer');
  if(closeBtn) closeBtn.onclick = closeDrawer;
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==='overlay') closeDrawer(); };

  const saveBtn = document.getElementById('save-client');
  if(saveBtn) saveBtn.onclick = saveClientFromForm;
  const cancelBtn = document.getElementById('cancel-form');
  if(cancelBtn) cancelBtn.onclick = closeDrawer;

  const addFollow = document.getElementById('add-followup');
  if(addFollow) addFollow.onclick = addFollowupEntry;
  const editFromDetail = document.getElementById('edit-from-detail');
  if(editFromDetail) editFromDetail.onclick = ()=>{ const id=openClientId; openForm(id); };
  const delFromDetail = document.getElementById('delete-from-detail');
  if(delFromDetail) delFromDetail.onclick = ()=>{ deleteClient(openClientId); closeDrawer(); };
}

async function saveClientFromForm(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ showToast('Name is required.'); return; }
  const data = {
    name,
    phone: document.getElementById('f-phone').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    position: document.getElementById('f-position').value.trim(),
    timing: document.getElementById('f-timing').value.trim(),
    company: document.getElementById('f-company').value.trim(),
    companyType: document.getElementById('f-companyType').value.trim(),
    location: document.getElementById('f-location').value.trim(),
    campaign: document.getElementById('f-campaign').value.trim(),
    comments: document.getElementById('f-comments').value.trim(),
    status: document.getElementById('f-status').value,
    nextFollowUp: document.getElementById('f-nextFollowUp').value,
    createdDate: document.getElementById('f-createdDate').value || todayISO(),
  };
  if(editClientId){
    const c = clients.find(x=>x.id===editClientId);
    Object.assign(c, data);
  } else {
    clients.push({ id: uid(), followUps: [], ...data });
  }
  await persistClients();
  showToast(editClientId ? 'Client updated.' : 'Client added.');
  closeDrawer();
}

async function deleteClient(id){
  if(!confirm('Delete this client and all follow-up history? This cannot be undone.')) return;
  clients = clients.filter(c=>c.id!==id);
  await persistClients();
  showToast('Client deleted.');
  render();
}

async function addFollowupEntry(){
  const c = clients.find(x=>x.id===openClientId);
  if(!c) return;
  const date = document.getElementById('fu-date').value || todayISO();
  const status = document.getElementById('fu-status').value;
  const comment = document.getElementById('fu-comment').value.trim();
  const next = document.getElementById('fu-next').value;
  c.followUps = c.followUps || [];
  c.followUps.push({ id: uid(), date, status, comment });
  c.status = status;
  if(next) c.nextFollowUp = next;
  await persistClients();
  followDraft = { status:'new', comment:'', date: todayISO() };
  showToast('Follow-up logged.');
  render();
}

/* ---------------- GOOGLE SHEET SYNC ---------------- */
async function pushToSheet(){
  if(!settings.sheetUrl){ showToast('Add your Web App URL first.'); return; }
  showToast('Pushing to sheet...');
  try{
    const res = await fetch(settings.sheetUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'push', clients })
    });
    if(!res.ok) throw new Error('Request failed');
    showToast('Pushed to Google Sheet.');
  }catch(e){
    showToast('Push failed — check the URL and deployment access.');
  }
}
async function pullFromSheet(){
  if(!settings.sheetUrl){ showToast('Add your Web App URL first.'); return; }
  if(!confirm('This replaces everything currently in the app with what is in the sheet. Continue?')) return;
  showToast('Pulling from sheet...');
  try{
    const res = await fetch(settings.sheetUrl + (settings.sheetUrl.includes('?')?'&':'?') + 'action=pull');
    if(!res.ok) throw new Error('Request failed');
    const data = await res.json();
    if(Array.isArray(data.clients)){
      clients = data.clients;
      await persistClients();
      showToast('Pulled from Google Sheet.');
      render();
    } else {
      showToast('Sheet returned no client data.');
    }
  }catch(e){
    showToast('Pull failed — check the URL and deployment access.');
  }
}

function exportCSV(){
  const headers = ['Name','Phone','Email','Position','Timing','Company','Company Type','Location','Campaign','Status','Created Date','Next Follow-up','Comments','Follow-up Log'];
  const rows = clients.map(c=>{
    const logStr = (c.followUps||[]).slice().sort((a,b)=>a.date.localeCompare(b.date))
      .map(f=>`${f.date} [${STATUS_LABELS[f.status]}]: ${f.comment||''}`).join(' | ');
    return [c.name,c.phone,c.email,c.position,c.timing,c.company,c.companyType,c.location,c.campaign,STATUS_LABELS[c.status],c.createdDate,c.nextFollowUp,c.comments,logStr];
  });
  const csv = [headers, ...rows].map(r=> r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `franks-crm-export-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('CSV downloaded.');
}
function csvEscape(v){
  v = (v==null? '' : String(v));
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
